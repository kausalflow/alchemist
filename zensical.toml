# Documentation site, built with Zensical (https://zensical.org).
#   uvx zensical serve    # preview on http://localhost:8000
#   uvx zensical build    # static site in ./site

[project]
site_name = "Alchemist"
site_description = "AI research system for chemical engineering process questions over an S3 data lake"
site_author = "Alchemist contributors"
repo_url = "https://github.com/kausalflow/alchemist"
repo_name = "kausalflow/alchemist"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 kausalflow"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "UI tour" = "ui-tour.md" },
  { "Concepts" = [
    "concepts/runs.md",
    "concepts/data-catalog.md",
    "concepts/access.md",
    "concepts/reproducibility.md",
    "concepts/knowledge.md",
  ] },
  { "Guides" = [
    "guides/web-app.md",
    "guides/models.md",
    "guides/real-questions.md",
    "guides/catalog-admin.md",
    "guides/s3.md",
    "guides/plugins.md",
    "guides/deploy-aws.md",
  ] },
  { "Reference" = [
    "reference/cli.md",
    "reference/api.md",
    "reference/configuration.md",
    "reference/run-folder.md",
    "reference/agent-tools.md",
    "reference/code-layout.md",
    "reference/deployment.md",
  ] },
  { "MVP and target design" = "design.md" },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true

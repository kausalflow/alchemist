[project]
name = "alchemist-infra"
version = "0.1.0"
description = "AWS CDK app that deploys Alchemist (ECS Fargate, Step Functions, Aurora, CloudFront)"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10.4,<11",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alchemist_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

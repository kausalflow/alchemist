# Example production environment. Replace every placeholder before `cdk deploy -c env=prod`.
# `cdk synth -c env=dev` works with these placeholders, so tests and CI need no AWS account.
env_name: prod
account: "333333333333"          # placeholder
region: eu-central-1

network:
  cidr: 10.40.0.0/20
  availability_zones: [eu-central-1a, eu-central-1b]
  api_egress: true                # API only: HTTPS out to verify the ALB's signed identity header
  # To deploy into a landing-zone VPC instead, set `existing:` (see config/example-existing-vpc.yaml).

lake:
  buckets:
    - name: example-plant-lake    # placeholder: the data-lake buckets Alchemist may read
      kms_key_arn: null
  plant_prefix_template: "s3://{bucket}/plant={plant}/"

storage:
  workspace_versioning: false     # open question 1 in the technical design
  work_expiry_days: 90
  retain_data: true

oidc:                             # placeholder: your identity provider's OIDC app
  issuer: https://idp.example.com
  authorization_endpoint: https://idp.example.com/oauth2/authorize
  token_endpoint: https://idp.example.com/oauth2/token
  user_info_endpoint: https://idp.example.com/oauth2/userinfo
  client_id: alchemist
  client_secret_name: alchemist/oidc-client-secret
  scope: openid email profile groups
  group_claim: groups

domain:                           # placeholder
  name: alchemist.example.com
  cloudfront_certificate_arn: arn:aws:acm:us-east-1:333333333333:certificate/00000000-0000-0000-0000-000000000000
  api_origin_name: alchemist-origin.example.com
  alb_certificate_arn: arn:aws:acm:eu-central-1:333333333333:certificate/00000000-0000-0000-0000-000000000001

bedrock:                          # placeholder: application inference profiles in one geography
  lead_model: arn:aws:bedrock:eu-central-1:333333333333:application-inference-profile/lead-placeholder
  sub_model: arn:aws:bedrock:eu-central-1:333333333333:application-inference-profile/sub-placeholder
  embedding_model: amazon.titan-embed-text-v2:0
  allowed_model_arns:
    - arn:aws:bedrock:eu-central-1:333333333333:application-inference-profile/lead-placeholder
    - arn:aws:bedrock:eu-central-1:333333333333:application-inference-profile/sub-placeholder
    - arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-opus-5-5*
    - arn:aws:bedrock:eu-*::foundation-model/anthropic.claude-sonnet-5-5*
    - arn:aws:bedrock:eu-central-1::foundation-model/amazon.titan-embed-text-v2:0
  invocation_logging: true
  guardrail: true

modules:                          # optional parts; the core (network, data, services, run workflow) is always on
  edge: true                      # CloudFront + SPA
  observability: true             # alarms, CloudTrail, break-glass
  indexers: true                  # nightly catalog index and knowledge ingestion

plugins:                          # see docs/guides/plugins.md and docs/guides/deploy-aws.md
  packages: []                    # pip specs installed into the image, e.g. ["acme-alchemist==1.2.0"]
  enabled: []                     # ALC_PLUGINS (empty = built-ins only); keep explicit in production
  modules: []                     # ALC_PLUGIN_MODULES
  access_provider: alb-oidc       # ALC_ACCESS_PROVIDER; users from verified OIDC claims, rules from s3://<workspace>/_config/access.yaml
  env: {}                         # extra settings for plugins
  infra: []                       # infrastructure plugins: modules with register(ctx)

database:
  min_acu: 0.5
  max_acu: 16
  deletion_protection: true

workflow:
  sandbox_mode: in_process        # `separate`: kernel in its own task with broker credentials (try in dev first)
  launcher: step_functions        # `queue`: a worker service takes steps from the run queue, scaled on its backlog
  # workers: {min_count: 1, max_count: 4, concurrency: 2}   # with launcher: queue
  approval_timeout_days: 14
  analysis_retries: 2             # a failed or timed-out analysis task restarts and resumes from its checkpoint

operations:
  alarm_email: null
  create_trail: true
  break_glass_principal_arns: []

tags:
  project: alchemist
  environment: prod

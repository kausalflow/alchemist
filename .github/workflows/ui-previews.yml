name: UI previews

# Regenerates the screenshots in docs/assets/ui from the offline demo (scripts/ui_previews/run.sh), uploads them as
# the ui-previews artifact, and warns when the committed ones are out of date. It never commits.
on:
  pull_request:
    paths:
      - "web/**"
      - "src/alchemist/api/**"
      - "src/alchemist/demo/**"
      - "scripts/ui_previews/**"
      - "docs/assets/ui/**"
      - ".github/workflows/ui-previews.yml"
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/ui_previews/package-lock.json
      - run: uv sync --locked
      - run: scripts/ui_previews/run.sh
        env:
          ALC_PREVIEW_DOCKER: "1"  # Playwright's image, the same renderer as a local run
      - name: Compare with the committed screenshots
        run: |
          changed="$(git status --porcelain -- docs/assets/ui)"
          if [ -n "$changed" ]; then
            echo "::warning::UI screenshots are out of date. Run scripts/ui_previews/run.sh and commit docs/assets/ui, or take them from the ui-previews artifact."
            { echo "### Screens that changed"; echo '```'; echo "$changed"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UI screenshots are up to date." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ui-previews
          path: docs/assets/ui

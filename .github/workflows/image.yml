name: Image

# Builds the container image, runs the docker compose stack end to end with it, checks the Helm chart, and publishes
# the image to ghcr.io/kausalflow/alchemist from main (tags latest, main, sha-<commit>) and from v* tags (the version).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: alchemist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: docker compose end to end
        run: deploy/compose/smoke.sh alchemist:ci
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - if: github.event_name == 'push'
        name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: |
          set -o pipefail
          args="--set database.host=db --set auth.oidc.issuer=https://login.example.com --set auth.oidc.audience=alchemist"
          helm lint deploy/helm/alchemist $args
          helm template t deploy/helm/alchemist $args > /dev/null
          helm template t deploy/helm/alchemist $args --set ollama.enabled=true --set ingress.enabled=true \
            --set persistence.enabled=true --set knowledge.existingConfigMap=docs > /dev/null
          helm template t deploy/helm/alchemist $args --set sandbox.enabled=false > /dev/null
          helm template t deploy/helm/alchemist $args --set sandbox.networkPolicy.enabled=false \
            --set sandbox.existingSecret=sandbox-keys > /dev/null
          # Required values are enforced.
          if helm template t deploy/helm/alchemist --set auth.oidc.issuer=x --set auth.oidc.audience=y 2>/dev/null; then
            echo "::error::helm template accepted a release without database.host"; exit 1
          fi

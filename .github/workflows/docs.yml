name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx zensical==0.0.70 build --clean --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

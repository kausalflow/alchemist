name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - name: pytest on PostgreSQL
        run: uv run pytest -q
        env:
          ALC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - run: |
          export ALC_HOME=$RUNNER_TEMP/alchemist-home
          uv run alchemist demo setup
          uv run alchemist demo run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: npx -y aws-cdk@2 synth -c env=dev --quiet
      - run: npx -y aws-cdk@2 synth -c env=prod --quiet

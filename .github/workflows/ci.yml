name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --locked
      - run: uv run pytest -q
      - run: |
          export ALC_HOME=$RUNNER_TEMP/alchemist-home
          uv run alchemist demo setup
          uv run alchemist demo run

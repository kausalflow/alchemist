[project]
name = "alchemist"
version = "0.1.0"
description = "AI research system for chemical engineering process questions over an S3 data lake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35",
    "cloudpathlib[s3]>=0.20",
    "cryptography>=43",
    "duckdb>=1.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "jinja2>=3.1",
    "jupyter-client>=8.6",
    "markdown>=3.6",
    "matplotlib>=3.9",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-ai-slim[anthropic,bedrock,google,openai]>=2.56.0",
    "pyyaml>=6",
    "scipy>=1.13",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alchemist = "alchemist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alchemist"]

[tool.pytest.ini_options]
testpaths = ["tests"]

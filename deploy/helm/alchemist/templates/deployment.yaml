apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alchemist.fullname" . }}
  labels: {{- include "alchemist.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if .Values.workers.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- else }}
  replicas: 1  # runs execute in this process; see values.yaml api
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels: {{- include "alchemist.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "alchemist.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "alchemist.serviceAccount" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate
          {{- include "alchemist.container" . | nindent 10 }}
          args: ["db", "migrate"]
      containers:
        - name: api
          {{- include "alchemist.container" . | nindent 10 }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        {{- include "alchemist.volumes" (dict "root" $ "persistent" .Values.persistence.enabled) | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}

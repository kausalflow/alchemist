apiVersion: v1
kind: Service
metadata:
  name: {{ include "alchemist.fullname" . }}
  labels: {{- include "alchemist.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "alchemist.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
